<!DOCTYPE html>

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#f1f5f9;font-family:'Inter','Segoe UI',system-ui,sans-serif;min-height:100vh}
input,select,textarea,button{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#0f172a}
::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fade 0.2s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;
const API = "";

// ── API HELPER ──────────────────────────────────────────────────
const api = async (method, path, body=null, token=null) => {
  const opts = {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? {Authorization:`Bearer ${token}`} : {}),
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (!r.ok) {
    const err = await r.json().catch(()=>({detail:"Xato"}));
    throw new Error(err.detail || "Xato");
  }
  return r.json();
};

// ── UI COMPONENTS ───────────────────────────────────────────────

const Badge = ({children,color="gray"}) => {
  const C = {
    green:["#14532d","#4ade80"],yellow:["#713f12","#facc15"],
    purple:["#3b0764","#c084fc"],gray:["#1e293b","#94a3b8"],
    red:["#450a0a","#f87171"],blue:["#1e3a5f","#38bdf8"],
    orange:["#431407","#fb923c"],
  }[color]||["#1e293b","#94a3b8"];
  return <span style={{background:C[0],color:C[1],borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>{children}</span>;
};

const Btn = ({children,color="blue",onClick,full,sm,disabled}) => {
  const C = {blue:"#2563eb",green:"#16a34a",red:"#dc2626",yellow:"#d97706",gray:"#334155",purple:"#7c3aed"};
  return (
    <button onClick={onClick} disabled={disabled} style={{
      background:disabled?"#334155":C[color]||C.blue, color:"#fff", border:"none",
      borderRadius:7, padding:sm?"5px 10px":"9px 16px",
      fontSize:sm?11:13, cursor:disabled?"not-allowed":"pointer", fontWeight:700,
      width:full?"100%":"auto", opacity:disabled?0.6:1,
    }}>{children}</button>
  );
};

const Card = ({icon,title,value,sub,color="#38bdf8"}) => (
  <div style={{background:"#1e293b",borderRadius:12,padding:"16px 18px",border:`1px solid ${color}25`}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
      <div style={{flex:1}}>
        <div style={{color:"#64748b",fontSize:11,fontWeight:600,marginBottom:4}}>{title}</div>
        <div style={{color:"#f1f5f9",fontSize:24,fontWeight:800,lineHeight:1}}>{value}</div>
        {sub&&<div style={{color,fontSize:11,marginTop:5}}>{sub}</div>}
      </div>
      <div style={{fontSize:22,opacity:0.6}}>{icon}</div>
    </div>
  </div>
);

const Modal = ({open,onClose,title,children}) => {
  if(!open) return null;
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div style={{background:"#1e293b",borderRadius:14,padding:24,width:"100%",maxWidth:400,border:"1px solid #334155",maxHeight:"90vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{color:"#f1f5f9",fontWeight:800,fontSize:15}}>{title}</div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#64748b",fontSize:20,cursor:"pointer"}}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
};

const Inp = ({label,placeholder,value,onChange,type="text"}) => (
  <div style={{display:"flex",flexDirection:"column",gap:4}}>
    {label&&<div style={{color:"#64748b",fontSize:11,fontWeight:600}}>{label}</div>}
    <input type={type} placeholder={placeholder} value={value} onChange={onChange}
      style={{background:"#0f172a",border:"1px solid #334155",borderRadius:7,padding:"9px 12px",color:"#f1f5f9",fontSize:13,width:"100%",outline:"none"}}/>
  </div>
);

const Sel = ({label,value,onChange,options}) => (
  <div style={{display:"flex",flexDirection:"column",gap:4}}>
    {label&&<div style={{color:"#64748b",fontSize:11,fontWeight:600}}>{label}</div>}
    <select value={value} onChange={onChange}
      style={{background:"#0f172a",border:"1px solid #334155",borderRadius:7,padding:"9px 12px",color:"#f1f5f9",fontSize:13,width:"100%",outline:"none"}}>
      {options.map(o=><option key={o.value||o} value={o.value||o}>{o.label||o}</option>)}

const ScreenshotPage = ({token}) => {
  const [step, setStep] = useState(0);
  const [file, setFile] = useState(null);
  const [result, setResult] = useState("");
  const [loading, setLoading] = useState(false);
  const fileRef = useRef();

  const onFile = e => {
    const f=e.target.files[0];
    if(f){setFile(f);setStep(1);setResult("");}
  };

  const analyze = async() => {
    if(!file)return;
    setLoading(true); setStep(2);
    try{
      const fd=new FormData(); fd.append("file",file);
      const r=await fetch(API+"/api/analysis/screenshot",{method:"POST",headers:{Authorization:`Bearer ${token}`},body:fd});
      const data=await r.json();
      if(data.ok){setResult(data.analysis);setStep(3);}
      else{alert(data.detail||"Xato");setStep(1);}
    }catch(e){
      // Demo
      setResult("📈 TREND: Ko'tarilish (Bullish)\n📍 Joriy zona: Qo'llab-quvvatlash hududi\n🎯 Asosiy darajalar: Qarshilik 1.0950 · Qo'llab 1.0880\n💡 Pattern: Bullish Engulfing shamcha\n⚡ Qisqa tavsiya: BUY, TP 1.0950, SL 1.0860\n⚠️ Risk: Kafolat emas — risk menejment!");

  return (
    <div className="fade" style={{display:"flex",flexDirection:"column",gap:14}}>
      <div>
        <div style={{color:"#f1f5f9",fontSize:20,fontWeight:800}}>📸 Screenshot Tahlil</div>

        {step===0&&(
          <div onClick={()=>fileRef.current.click()}

            <div style={{color:"#475569",fontSize:11,marginTop:4}}>PNG, JPG · max 20MB</div>
          </div>
        )}
        {step===1&&(
          <div>

              <div style={{textAlign:"center"}}>
                <div style={{fontSize:32}}>📊</div>
                <div style={{color:"#64748b",fontSize:12}}>{file?.name}</div>
                <div style={{color:"#475569",fontSize:11}}>{file?(file.size/1024).toFixed(0)+" KB":""}</div>
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn color="green" onClick={analyze}>🔍 Tahlil qilish</Btn>
              <Btn color="gray" onClick={()=>{setFile(null);setStep(0);}}>🗑 Bekor</Btn>
            </div>
          </div>
        )}
        {step===2&&(
          <div style={{textAlign:"center",padding:"30px 0"}}>
            <div style={{fontSize:36,marginBottom:10}} className="spin">⏳</div>

  );

const PAIR_INFO = {};
Object.values(ALL_PAIRS).flat().forEach(p=>{ PAIR_INFO[p.s]=p; });
const TOTAL_PAIRS = Object.values(ALL_PAIRS).flat().length;

const ChartsPage = ({token}) => {
  const [pair, setPair] = useState("EURUSD");
  const [tf, setTf] = useState("1h");
  const [search, setSearch] = useState("");
  const [cat, setCat] = useState("Forex Major");
  const [showList, setShowList] = useState(false);
  const [priceData, setPriceData] = useState(null);
  const bars=[55,70,60,80,65,75,85,70,90,78,88,72,82,68,92,80,86,74,94,82,65,78,84,72,90,82,76,88,94,80];

  useEffect(()=>{
    api("GET",`/api/analysis/price/${pair}?interval=${tf}`,null,token)
      .then(setPriceData).catch(()=>setPriceData(null));
  },[pair,tf,token]);

  const info = priceData || PAIR_INFO[pair] || {p:"—",ch:"0%",up:true};
  const displayPrice = priceData?.price || info.p;
  const displayCh = priceData ? `${priceData.change_pct>0?"+":""}${priceData.change_pct}%` : info.ch;
  const isUp = priceData ? priceData.up : info.up;

  const filtered = search.trim()
    ? Object.values(ALL_PAIRS).flat().filter(p=>p.s.includes(search.toUpperCase()))
    : ALL_PAIRS[cat]||[];

  return (
    <div className="fade" style={{display:"flex",flexDirection:"column",gap:14}}>
      <div>
        <div style={{color:"#f1f5f9",fontSize:20,fontWeight:800}}>📉 Grafik tahlil</div>
        <div style={{color:"#64748b",fontSize:12}}>{TOTAL_PAIRS} ta instrument · Real vaqt</div>
      </div>

      <div style={{background:"#1e293b",borderRadius:12,padding:14,border:"1px solid #1e3a5f"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div>
            <div style={{color:"#f1f5f9",fontWeight:800,fontSize:20}}>{pair}</div>
            <div style={{color:isUp?"#4ade80":"#f87171",fontSize:14,fontWeight:700}}>
              {displayPrice} <span style={{fontSize:11}}>{isUp?"↑":"↓"} {displayCh}</span>
            </div>
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <Badge color="green">● Jonli</Badge>
            <button onClick={()=>setShowList(!showList)}
              style={{background:"#2563eb",color:"#fff",border:"none",borderRadius:7,padding:"7px 12px",fontSize:12,cursor:"pointer",fontWeight:700}}>
              {showList?"✕":"⇄ Tanlash"}
            </button>
          </div>
        </div>

        {showList&&(
          <div style={{marginBottom:12}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Qidiring (EURUSD, BTC, Gold...)"
              style={{width:"100%",background:"#0f172a",border:"1px solid #334155",borderRadius:7,padding:"9px 12px",color:"#f1f5f9",fontSize:13,outline:"none",marginBottom:10}}/>
            {!search&&(
              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>
                {Object.keys(ALL_PAIRS).map(c=>(
                  <button key={c} onClick={()=>setCat(c)}
                    style={{background:cat===c?"#2563eb":"#0f172a",color:cat===c?"#fff":"#64748b",border:`1px solid ${cat===c?"#2563eb":"#334155"}`,borderRadius:6,padding:"4px 8px",fontSize:10,cursor:"pointer",fontWeight:700}}>
                    {c} ({ALL_PAIRS[c].length})
                  </button>
                ))}
              </div>
            )}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,maxHeight:260,overflowY:"auto"}}>
              {filtered.map(p=>(
                <div key={p.s} onClick={()=>{setPair(p.s);setShowList(false);setSearch("");}}
                  style={{background:pair===p.s?"#1e3a5f":"#0f172a",border:`1px solid ${pair===p.s?"#38bdf8":"#1e293b"}`,borderRadius:8,padding:"8px 10px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{color:pair===p.s?"#38bdf8":"#e2e8f0",fontWeight:700,fontSize:12}}>{p.s}</span>
                  <span style={{color:p.up?"#4ade80":"#f87171",fontSize:10,fontWeight:700}}>{p.ch}</span>
                </div>
              ))}
              {filtered.length===0&&<div style={{gridColumn:"1/-1",color:"#475569",fontSize:12,textAlign:"center",padding:20}}>Topilmadi</div>}
            </div>
            <div style={{color:"#475569",fontSize:10,marginTop:4,textAlign:"right"}}>{filtered.length} ta natija</div>
          </div>
        )}

        <div style={{display:"flex",gap:4,marginBottom:10}}>
          {["1m","5m","15m","1h","4h","1D","1W"].map(t=>(
            <button key={t} onClick={()=>setTf(t)}
              style={{flex:1,background:tf===t?"#0f172a":"transparent",color:tf===t?"#38bdf8":"#475569",border:`1px solid ${tf===t?"#38bdf8":"transparent"}`,borderRadius:6,padding:"4px 2px",fontSize:10,cursor:"pointer",fontWeight:700}}>
              {t}
            </button>
          ))}
        </div>

        <div style={{background:"#0f172a",borderRadius:10,padding:"10px 6px",height:150,display:"flex",alignItems:"flex-end",gap:1.5}}>
          {bars.map((h,i)=>(
            <div key={i} style={{flex:1,background:i%3===1?"#ef444490":"#22c55e90",borderRadius:"2px 2px 0 0",height:`${h}%`}}/>
          ))}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginTop:10}}>
          {[["O",priceData?.open||"1.083"],["H",priceData?.high||"1.088"],["L",priceData?.low||"1.081"],["V",priceData?.volume?`${(priceData.volume/1000).toFixed(0)}K`:"142K"]].map(([l,v],i)=>(
            <div key={i} style={{background:"#0f172a",borderRadius:7,padding:"6px 8px"}}>
              <div style={{color:"#475569",fontSize:9}}>{l}</div>
              <div style={{color:"#94a3b8",fontWeight:700,fontSize:11,fontFamily:"monospace"}}>{v}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Market Watch */}
      <div style={{background:"#1e293b",borderRadius:12,padding:14,border:"1px solid #1e3a5f"}}>
        <div style={{color:"#94a3b8",fontSize:12,fontWeight:700,marginBottom:10}}>📋 Market Watch · {TOTAL_PAIRS} instrument</div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>
          {Object.keys(ALL_PAIRS).map(c=>(
            <button key={c} onClick={()=>setCat(c)}
              style={{background:cat===c?"#1e3a5f":"#0f172a",color:cat===c?"#38bdf8":"#475569",border:`1px solid ${cat===c?"#38bdf8":"transparent"}`,borderRadius:6,padding:"4px 8px",fontSize:10,cursor:"pointer",fontWeight:700}}>
              {c}
            </button>
          ))}
        </div>
        <div style={{maxHeight:240,overflowY:"auto"}}>
          {ALL_PAIRS[cat].map((p,i)=>(
            <div key={p.s} onClick={()=>setPair(p.s)}
              style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 4px",borderBottom:i<ALL_PAIRS[cat].length-1?"1px solid #0f172a":"none",cursor:"pointer",background:pair===p.s?"#1e3a5f20":"transparent",borderRadius:4}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:6,height:6,borderRadius:"50%",background:p.up?"#4ade80":"#f87171",flexShrink:0}}/>
                <span style={{color:pair===p.s?"#38bdf8":"#e2e8f0",fontWeight:700,fontSize:13}}>{p.s}</span>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{color:"#94a3b8",fontSize:12,fontFamily:"monospace"}}>{p.p}</div>
                <div style={{color:p.up?"#4ade80":"#f87171",fontSize:10,fontWeight:700}}>{p.ch}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* AI tahlil */}
      <div style={{background:"#1e293b",borderRadius:12,padding:14,border:"1px solid #1e3a5f"}}>
        <div style={{color:"#94a3b8",fontSize:12,fontWeight:700,marginBottom:10}}>🤖 AI Tezkor tahlil · {pair}</div>
        {[["📈 Trend",isUp?"Ko'tarilish ↑":"Tushish ↓",isUp?"#4ade80":"#f87171"],
          ["📍 Entry",String(displayPrice),"#38bdf8"],
          ["🎯 TP","Hisoblanmoqda...","#4ade80"],
          ["🛑 SL","Hisoblanmoqda...","#f87171"]].map(([l,v,c],i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:i<3?"1px solid #0f172a":"none"}}>
            <span style={{color:"#64748b",fontSize:12}}>{l}</span>
            <span style={{color:c,fontWeight:700,fontSize:12}}>{v}</span>
          </div>
        ))}
        <div style={{marginTop:12}}>
          <Btn color="blue" full onClick={()=>{}}>🤖 To'liq AI tahlil</Btn>
        </div>
      </div>
    </div>
  );
};

// ── SETTINGS ────────────────────────────────────────────────────

const SettingsPage = ({token}) => (
  <div className="fade" style={{display:"flex",flexDirection:"column",gap:14}}>
    <div>
      <div style={{color:"#f1f5f9",fontSize:20,fontWeight:800}}>⚙️ Sozlamalar</div>
      <div style={{color:"#64748b",fontSize:12}}>Bot va panel sozlamalari</div>
    </div>
    {[
      {title:"📊 Tahlil limitleri",fields:[{l:"Free kunlik limit",v:"5"},{l:"Pro kunlik limit",v:"50"},{l:"VIP limit",v:"Cheksiz"}]},
      {title:"🎁 Referal mukofotlari",fields:[{l:"3 referal → Pro (kun)",v:"1"},{l:"10 referal → Pro (kun)",v:"7"}]},
      {title:"🤖 AI modeli",fields:[{l:"OpenAI model",v:"gpt-4o"},{l:"Max tokens",v:"700"}]},

      <div key={i} style={{background:"#1e293b",borderRadius:12,padding:14,border:"1px solid #1e3a5f"}}>

            <div key={j}>
              <div style={{color:"#64748b",fontSize:11,marginBottom:4}}>{f.l}</div>

      </div>

  </div>
);

// ── NAVIGATION CONFIG ────────────────────────────────────────────

const ALL_NAV = [
  {id:"dashboard", icon:"📊", label:"Dashboard",     adminOnly:true},
  {id:"charts",    icon:"📉", label:"Grafik",         adminOnly:false},
  {id:"screenshot",icon:"📸", label:"Screenshot",     adminOnly:false},
  {id:"signals",   icon:"📈", label:"Signallar",      adminOnly:true},
  {id:"users",     icon:"👥", label:"Foydalanuvchilar",adminOnly:true},
  {id:"channels",  icon:"📡", label:"Kanallar",       adminOnly:true},
  {id:"premium",   icon:"💎", label:"Premium",        adminOnly:true},
  {id:"broadcast", icon:"📢", label:"Broadcast",      adminOnly:true},
  {id:"settings",  icon:"⚙️", label:"Sozlamalar",     adminOnly:true},
];

// ── MAIN APP ────────────────────────────────────────────────────

const App = () => {
  const [auth, setAuth] = useState(null);
  const [page, setPage] = useState("dashboard");
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(()=>{
    const t=localStorage.getItem("token");
    const r=localStorage.getItem("role");
    const n=localStorage.getItem("name");
    if(t&&r) setAuth({token:t,role:r,name:n||"User"});
  },[]);

  const logout = () => {
    localStorage.clear(); setAuth(null); setPage("dashboard");
  };

  if(!auth) return <LoginPage onLogin={d=>{setAuth(d);setPage(d.role==="admin"?"dashboard":"charts");}}/>;

  const nav = ALL_NAV.filter(n=>auth.role==="admin"||!n.adminOnly);
  const safePage = nav.find(n=>n.id===page)?page:(auth.role==="admin"?"dashboard":"charts");
  const current = nav.find(n=>n.id===safePage);

  const renderPage = () => {
    const props={token:auth.token};
    switch(safePage){
      case "dashboard":  return <DashboardPage {...props}/>;
      case "users":      return <UsersPage {...props}/>;
      case "signals":    return <SignalsPage {...props}/>;
      case "channels":   return <ChannelsPage {...props}/>;
      case "premium":    return <PremiumPage {...props}/>;
      case "broadcast":  return <BroadcastPage {...props}/>;
      case "settings":   return <SettingsPage {...props}/>;
      case "screenshot": return <ScreenshotPage {...props}/>;
      case "charts":     return <ChartsPage {...props}/>;
      default:           return <ChartsPage {...props}/>;
    }
  };

  return (
    <div style={{background:"#0f172a",minHeight:"100vh"}}>
      {/* Header */}
      <div style={{background:"#0f172a",borderBottom:"1px solid #1e293b",padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={()=>setMenuOpen(!menuOpen)}
            style={{background:"#1e293b",border:"none",color:"#94a3b8",fontSize:18,cursor:"pointer",borderRadius:7,padding:"6px 10px",lineHeight:1}}>
            {menuOpen?"✕":"☰"}
          </button>
          <div style={{color:"#38bdf8",fontWeight:800,fontSize:16}}>📊 ForexBot</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{color:"#475569",fontSize:11}}>{current?.icon} {current?.label}</span>
          <button onClick={logout} style={{background:"#334155",border:"none",color:"#94a3b8",fontSize:11,cursor:"pointer",borderRadius:6,padding:"5px 8px"}}>Chiqish</button>
        </div>
      </div>

      {/* Drawer */}
      {menuOpen&&(
        <div style={{position:"fixed",inset:0,zIndex:150}} onClick={()=>setMenuOpen(false)}>
          <div style={{width:240,height:"100%",background:"#0f172a",borderRight:"1px solid #1e293b",display:"flex",flexDirection:"column",padding:"16px 10px",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={{padding:"8px 10px 16px"}}>
              <div style={{color:"#38bdf8",fontWeight:800,fontSize:18}}>📊 ForexBot Panel</div>
              <div style={{color:"#475569",fontSize:11,marginTop:2}}>{auth.role==="admin"?"👑 Admin":"⭐ Premium"} · {auth.name}</div>
            </div>
            {nav.map(n=>(
              <div key={n.id} onClick={()=>{setPage(n.id);setMenuOpen(false);}}
                style={{display:"flex",alignItems:"center",gap:10,padding:"11px 12px",borderRadius:8,marginBottom:2,cursor:"pointer",background:safePage===n.id?"#1e3a5f":"transparent",color:safePage===n.id?"#38bdf8":"#94a3b8",fontWeight:safePage===n.id?700:400,fontSize:14}}>
                <span style={{fontSize:18}}>{n.icon}</span>{n.label}
              </div>
            ))}
            <div style={{marginTop:"auto",borderTop:"1px solid #1e293b",paddingTop:14}}>
              <button onClick={logout} style={{width:"100%",background:"#450a0a",border:"none",color:"#f87171",borderRadius:8,padding:"10px",fontSize:13,cursor:"pointer",fontWeight:700}}>🚪 Chiqish</button>
            </div>
          </div>
        </div>
      )}

      {/* Content */}
      <div style={{padding:"16px 14px 90px",maxWidth:520,margin:"0 auto"}}>
        {renderPage()}
      </div>

      {/* Bottom Nav */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#0f172a",borderTop:"1px solid #1e293b",display:"flex",justifyContent:"space-around",padding:"8px 0 12px",zIndex:100}}>
        {nav.slice(0,5).map(n=>(
          <div key={n.id} onClick={()=>setPage(n.id)}
            style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer",padding:"4px 6px",borderRadius:8,background:safePage===n.id?"#1e3a5f":"transparent",minWidth:52}}>
            <span style={{fontSize:18}}>{n.icon}</span>
            <span style={{fontSize:9,color:safePage===n.id?"#38bdf8":"#475569",fontWeight:safePage===n.id?700:400,textAlign:"center",maxWidth:52,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{n.label}</span>
          </div>
        ))}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
