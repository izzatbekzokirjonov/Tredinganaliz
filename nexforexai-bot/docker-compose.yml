services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexforex
      POSTGRES_PASSWORD: nexforex
      POSTGRES_DB: nexforexai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nexforex:nexforex@db:5432/nexforexai

volumes:
  pgdata:
